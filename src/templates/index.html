<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube MP3 Letöltő</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 text-gray-100 flex items-center justify-center h-screen">
    <div class="bg-gray-800 p-8 rounded-2xl shadow-xl w-96 border border-gray-700 text-center">
        <form action="/convert" method="POST" enctype="multipart/form-data" class="space-y-4">
            <input type="file" name="file" accept=".txt" required class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer">
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 font-semibold py-2 px-4 rounded-lg transition duration-200 cursor-pointer">
                Letöltés
            </button>
        </form>
    </div>
</body>
</html>

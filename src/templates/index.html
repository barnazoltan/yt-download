<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube MP3 Downloader</title>
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif;">

    <!-- A form, ami a fájl kiválasztása után azonnal elküldi magát -->
    <form id="uploadForm" action="/convert" method="POST" enctype="multipart/form-data">
        <label style="cursor: pointer; background: #000; color: #fff; padding: 12px 24px; border-radius: 4px; font-weight: bold;">
            Select .txt & Download
            <input type="file" name="file" accept=".txt" required style="display: none;" onchange="document.getElementById('uploadForm').submit()">
        </label>
    </form>

</body>
</html>
